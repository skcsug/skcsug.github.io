<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>JHC</title>
  <!--
    JHC 모노그램 — 똑바로 선 모노라인 글자.
    같은 굵기(6) · 수직/수평 획 · 각진 끝. J의 윗줄이 H의 왼쪽 기둥과 만나고,
    C는 오른쪽 아래로 한 단 내려앉습니다. 배경은 투명, 다크 모드에서는 흰 획.
  -->
  <style>
    .m { fill: none; stroke: #111111; stroke-width: 6; stroke-linecap: square; stroke-linejoin: miter; }
    @media (prefers-color-scheme: dark) { .m { stroke: #ffffff; } }
  </style>
  <g class="m">
    <path d="M 6 10 H 30"/>
    <path d="M 19 10 V 34 A 6.5 6.5 0 0 1 6 34 V 31"/>
    <path d="M 30 10 V 48"/>
    <path d="M 42 18 V 48"/>
    <path d="M 30 32 H 42"/>
    <path d="M 58.5 40.5 A 8.5 8.5 0 1 0 58.5 52.5"/>
  </g>
</svg>
